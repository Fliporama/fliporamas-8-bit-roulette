name: Task
description: Track one focused feature, fix, or maintenance change.
title: ""
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why?
      placeholder: Describe the expected outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
      placeholder: Use one criterion per line.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Dependencies, constraints, or related work.
      placeholder: Add any constraints or dependencies.
    validations:
      required: false